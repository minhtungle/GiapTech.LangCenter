name: Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/soccerroom-api

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & Build (backend)
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

      - name: Test (backend)
        run: dotnet test --no-build -c Release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build (frontend)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Frontend là static assets do Caddy phục vụ trực tiếp — không đóng gói thành
      # container riêng (xem docs/kien-truc/adr/0004-ha-tang-tu-host-vps.md).
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  push-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/GiapTech.SoccerRoom.API/Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:latest,${{ env.IMAGE_API }}:${{ github.sha }}
          # Tái dùng layer giữa các lần build — restore NuGet là bước lâu nhất.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: push-images
    runs-on: ubuntu-latest
    steps:
      # Frontend static: đồng bộ thẳng vào thư mục Caddy mount (./frontend/dist)
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Copy frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend-dist/*"
          target: /opt/clubmgmt/frontend/dist
          strip_components: 1
          rm: true

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/clubmgmt
            docker compose pull
            docker compose up -d
            docker image prune -f
