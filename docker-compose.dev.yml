# Lớp phủ cho máy dev — dùng kèm docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Khác bản production: Caddy phục vụ HTTP trên localhost (không xin cert Let's Encrypt),
# và mở port PostgreSQL/MinIO ra host để tiện xem dữ liệu.

services:
  caddy:
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro

  api:
    build:
      context: .
      dockerfile: src/GiapTech.LangCenter.API/Dockerfile
    image: langcenter-api:local
    environment:
      # TẮT giới hạn tần suất trên máy dev — chỉ ở đây, KHÔNG ở production.
      #
      # Bộ E2E chạy 44 test, mỗi test tạo một CLB rồi đăng nhập 2 lần từ CÙNG một IP. Hạn
      # `XacThuc` là 10/phút mỗi IP nên từ test thứ 5 trở đi `waitForURL` timeout ở bước đăng
      # nhập — 8 test đỏ vì lý do không liên quan gì tới thứ chúng kiểm (đã xảy ra 21/08).
      #
      # Cách sai là nới hạn mức trong `GioiHanTanSuat`: production sẽ mất lớp bảo vệ chỉ vì test
      # cần chạy nhanh. Cách đúng là tắt bằng cấu hình ở đúng môi trường cần tắt.
      #
      # `GioiHanTanSuatTests` vẫn BẬT cờ trong factory riêng nên cơ chế vẫn được canh.
      GIOI_HAN_TAN_SUAT: "false"

  postgres:
    # Chỉ ở dev: mở port để nối psql/DBeaver từ máy. Bản production KHÔNG có dòng này.
    ports:
      - "55432:5432"

  minio:
    # 9000/9001 hay bị Docker Desktop và các công cụ khác chiếm — dịch lên 59000 cho chắc.
    ports:
      - "59000:9000"
      - "59001:9001"
