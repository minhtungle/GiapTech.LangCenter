version: "3.9"

# Mọi service (trừ Caddy) chỉ nằm trong network nội bộ "backend" — không expose port ra Internet.
# Xem docs/kien-truc/adr/0004-ha-tang-tu-host-vps.md

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
  grafana-data:

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    depends_on:
      - api

  api:
    image: ghcr.io/giaptech/soccerroom-api:latest
    restart: unless-stopped
    env_file: .env
    networks:
      - backend
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    # KHÔNG map port ra host — chỉ truy cập qua network nội bộ

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - backend
    # Console MinIO (9001) chỉ truy cập qua SSH tunnel khi cần quản trị, không public

  # ---- Quan sát hệ thống (tuỳ chọn, bật khi cần) ----
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
