# VPS này dùng Nginx + certbot có sẵn làm reverse proxy chung cho mọi domain (không dùng
# Caddy — tránh xung đột port 80/443 với Nginx đang chạy các dự án khác). Nginx proxy vào
# service `api` qua 127.0.0.1:<port>, và phục vụ static frontend build trực tiếp.
#
# Chạy:  cp .env.example .env  →  điền giá trị  →  docker compose up -d

name: langcenter

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  grafana-data:

services:
  api:
    # Build tại chỗ nếu chưa có image; trên VPS thì `docker compose pull` lấy bản CI đã đẩy.
    build:
      context: .
      dockerfile: src/GiapTech.LangCenter.API/Dockerfile
    image: ${IMAGE_API:-ghcr.io/minhtungle/langcenter-api:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-15080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Nginx đã kết thúc TLS trước khi proxy vào đây — xem Program.cs
      SAU_REVERSE_PROXY: "true"
      # Host là TÊN SERVICE trong network nội bộ, không phải localhost.
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?can JWT_SECRET toi thieu 32 ky tu}
      JWT_ISSUER: ${JWT_ISSUER:-langcenter-api}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      # Trung tâm đầu tiên trên cài đặt MỚI (23/09/2026). Bỏ trống ⇒ không tạo gì.
      # Hệ thống CỐ Ý không tự sinh mật khẩu: seed chạy trong container, không có đường trả
      # về nào ngoài log — mà log thì ai đọc được cũng thấy. Xem `TrungTamDauTien`.
      # GỠ biến này sau khi đã tạo và đổi mật khẩu.
      TRUNG_TAM_DAU_TIEN_MAT_KHAU: ${TRUNG_TAM_DAU_TIEN_MAT_KHAU:-}
      TRUNG_TAM_DAU_TIEN_TEN: ${TRUNG_TAM_DAU_TIEN_TEN:-}
      # Tài khoản chủ hệ thống đầu tiên (ADR-0009). Không đặt mật khẩu ⇒ không tạo, và site
      # chủ không vào được — cố ý KHÔNG có endpoint tạo tài khoản chủ.
      CHU_HE_THONG_MAT_KHAU: ${CHU_HE_THONG_MAT_KHAU:-}
      CHU_HE_THONG_USERNAME: ${CHU_HE_THONG_USERNAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@langcenter.local}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      # Kho ảnh — endpoint là TÊN SERVICE nội bộ, MinIO không expose ra Internet (quy tắc #6).
      # Dùng chung tài khoản root: CLB phong trào một VPS, tạo access key riêng chỉ thêm một
      # thứ phải xoay vòng mà không giảm rủi ro thực tế nào.
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:?can MINIO_ROOT_USER}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:?can MINIO_ROOT_PASSWORD}
      Minio__Bucket: ${MINIO_BUCKET:-langcenter-anh}
      Minio__UseSsl: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `wget` CÓ trong ảnh aspnet:8.0-alpine (BusyBox cung cấp) — đã kiểm chứng: healthcheck
      # này chạy được và api báo `healthy`. Comment cũ nói ngược lại là sai.
      # `curl` thì KHÔNG có, nên đừng đổi sang curl.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?can POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      # API chờ healthcheck này: khởi động khi DB chưa sẵn sàng sẽ chết ngay lúc migrate.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # KHÔNG map port ra host — chỉ truy cập qua network nội bộ

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?can MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?can MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - backend
    # Console MinIO (9001) chỉ truy cập qua SSH tunnel khi cần quản trị, không public

  # ---- Quan sát hệ thống (tuỳ chọn) ----
  # Bật bằng: docker compose --profile quan-sat up -d
  # Tách profile để `docker compose up` mặc định chỉ chạy thứ cần cho ứng dụng.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ["quan-sat"]
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    profiles: ["quan-sat"]
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - backend

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    profiles: ["quan-sat"]
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    profiles: ["quan-sat"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend
