# Nginx server-block cho GiapTech.LangCenter.
#
# VPS dùng **Nginx + certbot có sẵn** làm reverse proxy chung cho mọi domain (không dùng Caddy
# — tránh xung đột port 80/443 với các dự án khác đang chạy). Xem docker-compose.yml.
#
# ## Vì sao file này nằm TRONG repo
#
# Trước 15/09/2026 cấu hình proxy chỉ sống trên VPS, còn trong repo là `Caddyfile` của kiến
# trúc cũ. Hệ quả: `Caddyfile` có đủ bộ header bảo mật nên đọc repo tưởng là đã có, trong khi
# production **không có HSTS, không có X-Frame-Options, không có nosniff** — không ai thấy vì
# không có chỗ nào đối chiếu. Cấu hình bảo mật phải nằm trong repo để review được như mã.
#
# ## Cài đặt
#
#   sudo cp deploy/nginx/langcenter.conf /etc/nginx/sites-available/langcenter.conf
#   sudo ln -s /etc/nginx/sites-available/langcenter.conf /etc/nginx/sites-enabled/
#   # sửa DOMAIN và API_PORT cho khớp .env
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lms.example.com     # cấp chứng chỉ + tự thêm block 443
#
# `certbot --nginx` tự chèn `listen 443 ssl`, đường dẫn chứng chỉ và block chuyển hướng 80→443.
# Đừng viết tay phần đó — certbot cần tự quản để gia hạn được.

server {
    listen 80;
    listen [::]:80;
    server_name lms.example.com;          # ĐỔI cho khớp domain thật

    # certbot thêm block chuyển hướng sang 443 ở đây khi chạy lần đầu.

    # Giới hạn kích thước request: mặc định Nginx là 1MB, mà API nhận ảnh và tệp đính kèm.
    # Đặt ở đây chứ không để mặc định, nếu không tải tệp lớn sẽ 413 mà log API trống trơn.
    client_max_body_size 20m;

    # ---------- Header bảo mật ----------
    #
    # `always` là bắt buộc: không có nó Nginx bỏ header với phản hồi 4xx/5xx, tức đúng những
    # phản hồi mà trang lỗi có thể bị nhúng trong iframe của kẻ tấn công.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Không cần API nào trong ba nhóm này — tắt để giảm bề mặt.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # KHÔNG đặt CSP quá chặt: frontend dùng `blob:` cho ảnh tải qua axios và `data:` cho
    # favicon — chặn hai scheme đó sẽ làm ảnh biến mất mà không có lỗi nào trên màn hình.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;

    server_tokens off;                    # không lộ phiên bản Nginx

    # ---------- Hạn mức tầng proxy (nợ N3) ----------
    #
    # Lớp NGOÀI, độc lập với hạn mức trong ứng dụng (`GioiHanTanSuat.cs`, 10 req/phút/IP).
    # Cần cả hai: lớp trong biết nghiệp vụ nhưng vẫn tốn một vòng xử lý ASP.NET cho mỗi
    # request; lớp này chặn trước khi tới đó. Zone khai ở http-block (xem ghi chú cuối file).
    location = /api/v1/dang-ky-trung-tam {
        limit_req zone=langcenter_dangky burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:15080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/api/v1/(auth|quen-mat-khau|dat-lai-mat-khau) {
        limit_req zone=langcenter_xacthuc burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:15080;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:15080;   # khớp API_PORT trong .env
        include /etc/nginx/proxy_params;

        # GHI ĐÈ, không append (`$proxy_add_x_forwarded_for`).
        #
        # Đây là điểm dễ sai nhất của file này. `GioiHanTanSuat.cs` đọc **phần tử cuối** của
        # `X-Forwarded-For` khi `SAU_REVERSE_PROXY=true` — hành vi đã đo thật với Caddy 2.11.
        # Nginx append thì phần tử cuối là giá trị **client tự đặt**, nên bất kỳ ai cũng vượt
        # được hạn mức bằng cách gửi header giả. Ghi đè bằng `$remote_addr` giữ đúng giả định.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Health endpoint cho Uptime Kuma và CI — nằm ngoài /api.
    location = /health {
        proxy_pass http://127.0.0.1:15080;
        include /etc/nginx/proxy_params;
        access_log off;
    }

    # ---------- Static SPA ----------
    location / {
        root /srv/langcenter/frontend;     # thư mục build của Vite (npm run build)
        try_files $uri /index.html;

        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
    }

    # Asset của Vite có hash trong tên nên cache vĩnh viễn được.
    location /assets/ {
        root /srv/langcenter/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html KHÔNG cache: nếu không người dùng giữ bản cũ mãi sau mỗi lần deploy.
    location = /index.html {
        root /srv/langcenter/frontend;
        add_header Cache-Control "no-cache";
    }
}

# ---------------------------------------------------------------------------
# Khai zone hạn mức — đặt trong http-block, KHÔNG đặt trong server-block.
# Thêm vào /etc/nginx/nginx.conf (mục http) hoặc /etc/nginx/conf.d/langcenter-ratelimit.conf:
#
#   limit_req_zone $binary_remote_addr zone=langcenter_dangky:10m  rate=6r/m;
#   limit_req_zone $binary_remote_addr zone=langcenter_xacthuc:10m rate=30r/m;
#
# Đặt trong server-block sẽ `nginx -t` đỏ với "limit_req_zone directive is not allowed here".
# ---------------------------------------------------------------------------
